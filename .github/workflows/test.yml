name: Test

on: [push, pull_request]

jobs:
  rspec:
    name: RSpec
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
        gemfile: [gemfiles/rails_8.1.gemfile]
        orm: [active_record]
        adapter: [sqlite3]
        asset: [propshaft]
        include:
          - ruby: "3.4"
            gemfile: gemfiles/rails_8.1.gemfile
            orm: active_record
            adapter: sqlite3
            asset: external
          - ruby: 2.7
            gemfile: gemfiles/rails_7.0.gemfile
            orm: active_record
            adapter: sqlite3
            asset: sprockets
          - ruby: "3.0"
            gemfile: gemfiles/rails_7.0.gemfile
            orm: active_record
            adapter: sqlite3
            asset: sprockets
          - ruby: "3.1"
            gemfile: gemfiles/rails_7.1.gemfile
            orm: active_record
            adapter: sqlite3
            asset: sprockets
          - ruby: "3.2"
            gemfile: gemfiles/rails_7.2.gemfile
            orm: active_record
            adapter: sqlite3
            asset: sprockets
          - ruby: "3.3"
            gemfile: gemfiles/rails_8.0.gemfile
            orm: active_record
            adapter: sqlite3
            asset: sprockets
          - ruby: "3.4"
            gemfile: gemfiles/rails_8.1.gemfile
            orm: active_record
            adapter: mysql2
            asset: propshaft
          - ruby: "3.4"
            gemfile: gemfiles/rails_8.1.gemfile
            orm: active_record
            adapter: postgresql
            asset: sprockets
          - ruby: "3.4"
            gemfile: gemfiles/rails_8.1.gemfile
            orm: active_record
            adapter: sqlite3
            asset: external
          - ruby: "3.4"
            gemfile: gemfiles/rails_8.1.gemfile
            orm: active_record
            adapter: sqlite3
            asset: sprockets
          - ruby: "3.2"
            gemfile: gemfiles/composite_primary_keys.gemfile
            orm: active_record
            adapter: sqlite3
            asset: sprockets
          - ruby: 2.7
            gemfile: gemfiles/rails_7.0.gemfile
            orm: mongoid
            adapter: sqlite3
            asset: sprockets
          - ruby: "3.1"
            gemfile: gemfiles/rails_7.0.gemfile
            orm: mongoid
            adapter: sqlite3
            asset: sprockets
          - ruby: "3.2"
            gemfile: gemfiles/rails_7.1.gemfile
            orm: mongoid
            adapter: sqlite3
            asset: sprockets
          - ruby: "3.3"
            gemfile: gemfiles/rails_7.2.gemfile
            orm: mongoid
            adapter: sqlite3
            asset: sprockets
          - ruby: "3.4"
            gemfile: gemfiles/rails_8.0.gemfile
            orm: mongoid
            adapter: sqlite3
            asset: sprockets
          - ruby: "3.4"
            gemfile: gemfiles/rails_8.1.gemfile
            orm: mongoid
            adapter: sqlite3
            asset: sprockets
          - ruby: jruby-9.4
            gemfile: gemfiles/rails_7.1.gemfile
            orm: active_record
            adapter: mysql2
            asset: sprockets
          - ruby: jruby-9.4
            gemfile: gemfiles/rails_7.1.gemfile
            orm: mongoid
            adapter: sqlite3
            asset: sprockets
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
      postgres:
        image: postgres:11
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mongo:
        image: mongo:4.4
        ports:
          - 27017:27017
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      CI_ORM: ${{ matrix.orm }}
      CI_ASSET: ${{ matrix.asset }}
      JRUBY_OPTS: --debug
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: gems-${{ hashFiles('Gemfile', 'gemfiles/*.gemfile') }}
        env:
          MAKEFLAGS: make --jobs 4
          BUNDLE_WITHOUT: development
      # Only the :external asset_source builds anything; :propshaft / :sprockets
      # serve the committed bundle, so those jobs run with no Node at all.
      - name: Set up Node
        if: matrix.asset == 'external'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ImageMagick
        run: sudo apt-get install imagemagick
      - name: Setup application
        env:
          BUNDLE_GEMFILE: ../../${{ matrix.gemfile }}
          CI_ASSET: ${{ matrix.asset }}
          CI_DB_ADAPTER: ${{ matrix.adapter }}
          RAILS_ENV: test
        run: |
          if [ "${{ matrix.asset }}" = "external" ]; then npm ci; fi
          cd spec/dummy_app
          bundle exec rake rails_admin:prepare_ci_env db:create db:schema:load
      - name: Run tests
        run: bundle exec rspec
      - name: Coveralls Parallel
        if: ${{ github.repository_owner == 'railsadminteam' }}
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.github_token }}
          flag-name: run-${{ matrix.ruby }}-${{ matrix.gemfile }}-${{ matrix.orm }}-${{ matrix.adapter }}
          parallel: true

  coveralls:
    name: Coveralls
    if: ${{ github.repository_owner == 'railsadminteam' }}
    needs: rspec
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true

  assets:
    name: Precompiled assets (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Rebuild assets
        run: npm run build
      - name: Check committed assets are up to date
        run: git diff --exit-code -- app/assets/builds

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run check
        run: npm run format:check

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          cache-version: gems-${{ hashFiles('Gemfile') }}
      - name: Install dependencies
        run: bundle install --without development --jobs=3 --retry=3 --path=vendor/bundle
      - name: Run check
        run: bundle exec rake rubocop
