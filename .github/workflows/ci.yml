name: CI

# No pull_request trigger: it stops firing once a PR turns CONFLICTING. A fork PR
# therefore reports nothing until its head commit is pushed to a branch here.
# workflow_call lets release.yml run this exact suite on the tagged commit.
on:
  push:
    branches: ["**"]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  rspec:
    name: RSpec (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    # A green leg takes about 5 minutes; this only fires on a hang, which would otherwise
    # sit on GitHub's 6-hour default without ever reporting.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Single supported runtime (Ruby 4.0 / Rails 8.1 / ActiveRecord / importmap + Propshaft).
        # The adapter axis is kept because the filter/search SQL is generated per-adapter
        # (AbstractModel::StatementBuilder), so each adapter exercises a distinct code path.
        adapter: [sqlite3, postgresql, mysql2]
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        options: --health-cmd "mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      CI_DB_ADAPTER: ${{ matrix.adapter }}
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Install libvips
        # ActiveStorage's :vips variant processor; ruby-vips dlopens the libvips shared library.
        # libvips-dev is the version-stable package name (the runtime lib is libvips42t64 on
        # Ubuntu 24.04 after the t64 transition); installing -dev pulls in that runtime.
        # A normal install takes about a minute; a stalled apt mirror fails here, fast.
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      # Chrome is pre-installed on ubuntu-latest; Cuprite/Ferrum auto-detect it for the js: true specs.
      - name: Provision the dummy app database
        working-directory: spec/dummy_app
        run: bundle exec rake rails_admin:prepare_ci_env db:create db:schema:load
      - name: Run tests
        run: bundle exec rspec

  standard:
    name: Standard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run Standard
        run: bundle exec standardrb

  brakeman:
    name: Brakeman
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # -A runs the full check set; reviewed false positives are recorded in config/brakeman.ignore.
      - name: Run Brakeman
        run: bundle exec brakeman -A --no-pager

  hyperdrive:
    name: Hyperdrive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Check Hyperdrive companion content
        run: bundle exec rake hyperdrive:skills:check hyperdrive:manifest:check

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # No package.json ships (importmap self-hosts the runtime modules), so Prettier is pinned via
      # npx and only formats the JS/CSS source. See .prettierignore for what is intentionally excluded.
      - name: Check JS/CSS formatting
        run: npx --yes prettier@2.8.8 --check .
